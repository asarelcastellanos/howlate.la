# Lint, format and tests on every PR and on every push to main.
#
# Runs on 3.11 because that is what Debian ships on the collector VM, and on
# 3.14 because that is what development happens on. What each run covers:
#
#   - ruff checks syntax against 3.11, so newer syntax fails here
#   - every collector module is imported, so a missing dependency or a newer
#     standard-library name used at import time fails here
#   - the collector tests exercise the recorder's feeds, rotation and alarms
#
# A newer standard-library call inside a function body that no test reaches
# can still pass. Tests in later versions narrow that.
#
# Each package is installed on its own, the way it is deployed. The VM installs
# only collector/, so a collector import that is declared nowhere but the
# pipeline would pass if both shared one environment.
#
# Actions are pinned to a commit rather than a tag, because a tag can be moved
# to point at different code after it was reviewed.

name: checks

on:
  pull_request:
    # `edited` starts a new run when a PR moves to a different base branch.
    # The head commit does not change, so the old all-checks result stays
    # visible until the new run finishes. Wait for it before merging.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# One run per PR at a time. A newer run cancels the older one, and a cancelled
# run ends with a failed all-checks, so a stale run cannot finish last and pass.
# Pushes to main are never cancelled: each commit there needs its own result,
# because the deploy workflow waits for all-checks on exactly that commit.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Pinned so a new ruff release cannot fail a PR that changed nothing.
      - run: pip install ruff==0.17.4

      - name: Lint
        run: ruff check --output-format github .

      - name: Formatting
        run: ruff format --check .

  collector:
    name: collector (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install the collector alone, as the VM does
        run: pip install -e collector

      - name: Import every module
        run: >-
          python -c "import howlate_collector.record, howlate_collector.routes,
          howlate_collector.spool, howlate_collector.upload,
          howlate_collector.timetable"

      - name: Collector tests
        run: python collector/tests/test_record.py

      - name: Raw bucket lifecycle rule
        run: python collector/tests/test_lifecycle.py

  pipeline:
    name: pipeline (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install the pipeline alone
        run: pip install -e pipeline

      - name: Import every module
        run: >-
          python -c "import howlate_pipeline.__main__, howlate_pipeline.aggregate,
          howlate_pipeline.arrivals, howlate_pipeline.gtfs,
          howlate_pipeline.labels, howlate_pipeline.report"

      # Only after the import check: pytest brings packages of its own, and a
      # module that leaned on one of them would otherwise pass.
      - name: Install the test extra
        run: pip install -e "pipeline[test]"

      - name: Pipeline tests
        run: python -m pytest pipeline/tests -q

  # Builds the Dockerfile and runs the suite inside the image, against the
  # installed code rather than the checkout, as the unprivileged user the image
  # runs as. A broken image fails here. The deploy builds its own image, so
  # this does not prove what is deployed; pinning that build is part of #17.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the pipeline image
        run: docker build -f pipeline/Dockerfile -t howlate-pipeline .

      - name: The entry point answers
        run: docker run --rm howlate-pipeline --help

      - name: Pipeline tests inside the image
        run: >-
          docker run --rm -v "$PWD/pipeline/tests:/tests:ro"
          --entrypoint sh howlate-pipeline -c
          "pip install --quiet --user pytest==9.2.0 &&
          python -m pytest /tests -q -p no:cacheprovider --basetemp /work/pytest"

  # The site installs from its own lockfile, so `npm ci` fails when
  # package.json and package-lock.json disagree. Node 22 is the oldest version
  # package.json allows.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # A schema change without regenerated types leaves a diff here.
      - name: Types match the pipeline schemas
        run: |
          npm run types
          git diff --exit-code -- src/lib/data/types.ts

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  # Opens the built site in Chromium and checks every line page, the
  # behind-the-scenes page, accessibility and mobile scores against the fixture
  # in web/e2e/fixture. The fixture is trimmed real aggregate output, plus a
  # health.json built by the pipeline's own builder, and
  # pipeline/tests/test_web_fixture.py checks its files against the pipeline's
  # schemas. Chromium comes from the pinned @playwright/test, and Lighthouse
  # uses that same Chromium. The fixture is staged into
  # .svelte-kit/output/client because `vite preview` serves that folder and not
  # build/. The preview runs in the background for every step after "Serve".
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # PUBLIC_DATA_BASE is set here and not in the config, so the site reads
      # the fixture at /data and never the live bucket.
      - name: Build against local data
        run: PUBLIC_DATA_BASE=/data npm run build

      - name: Stage the fixture
        run: npm run e2e:stage

      - name: Serve
        id: serve
        run: |
          node node_modules/vite/bin/vite.js preview --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview.pid"
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:4173/data/site/current.json; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          echo "The preview did not serve the fixture within 30 seconds."
          exit 1

      - name: Playwright and axe
        run: npm run e2e

      # Runs after a Playwright failure too, so one run reports both.
      - name: Lighthouse
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: npm run lighthouse

      - name: Stop the preview
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/preview.pid")" || true

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/e2e/reports/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: web/e2e/reports/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  # One stable name for branch protection to require, whatever the jobs above
  # become later.
  all-checks:
    needs: [lint, collector, pipeline, container, web, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: >-
          test "${{ needs.lint.result }}" = success &&
          test "${{ needs.collector.result }}" = success &&
          test "${{ needs.pipeline.result }}" = success &&
          test "${{ needs.container.result }}" = success &&
          test "${{ needs.web.result }}" = success &&
          test "${{ needs.browser.result }}" = success
